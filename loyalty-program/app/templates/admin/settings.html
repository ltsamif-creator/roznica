{% extends "base.html" %}

{% block title %}Настройки{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Настройки приложения</h2>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <form method="POST">
                <div class="mb-3">
                    <label for="app_name" class="form-label">Название приложения</label>
                    <input type="text" name="app_name" id="app_name" class="form-control" value="{{ settings.app_name }}">
                </div>
                
                <div class="mb-3">
                    <label for="discount_percent" class="form-label">Размер скидки (%)</label>
                    <input type="number" name="discount_percent" id="discount_percent" class="form-control" value="{{ settings.discount_percent }}" min="1" max="100">
                </div>
                
                <div class="mb-3">
                    <label for="sms_template" class="form-label">Шаблон SMS</label>
                    <textarea name="sms_template" id="sms_template" class="form-control" rows="3">{{ settings.sms_template }}</textarea>
                    <small class="form-text text-muted">Используйте {code} для вставки кода подтверждения</small>
                </div>
                
                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="send_welcome_sms" id="send_welcome_sms" class="form-check-input" {% if settings.send_welcome_sms %}checked{% endif %}>
                        <label for="send_welcome_sms" class="form-check-label">Отправлять приветственное SMS</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Сохранить настройки</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
