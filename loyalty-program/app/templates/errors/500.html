{% extends "base.html" %}

{% block title %}500 - Ошибка сервера{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1 class="error-code">500</h1>
        <h2 class="error-title">Ошибка сервера</h2>
        <p class="error-message">Произошла внутренняя ошибка сервера. Пожалуйста, попробуйте позже.</p>
        <a href="{{ url_for('public.index') }}" class="btn btn-primary">На главную</a>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.error-container {
    text-align: center;
    padding: 60px 20px;
}

.error-code {
    font-size: 96px;
    color: #e74c3c;
    margin-bottom: 20px;
}

.error-title {
    font-size: 32px;
    color: #333;
    margin-bottom: 20px;
}

.error-message {
    font-size: 18px;
    color: #666;
    margin-bottom: 30px;
}
</style>
{% endblock %}
