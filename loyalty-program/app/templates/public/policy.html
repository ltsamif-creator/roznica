{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ app_name }}{% endblock %}

{% block content %}
<div class="page-container">
    <article class="content-page">
        <h1>{{ page.title }}</h1>
        <div class="page-content">
            {{ page.content | safe }}
        </div>
        <p class="page-version">Версия: {{ page.version }}</p>
    </article>
</div>
{% endblock %}
