{% extends "base.html" %}

{% block title %}Подтверждение - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Подтверждение телефона</h1>
        <p class="auth-subtitle">Введите 4-значный код из SMS</p>
        
        <form method="POST" action="{{ url_for('public.verify_sms') }}" class="auth-form">
            <div class="form-group">
                <label for="code">Код подтверждения</label>
                <input type="text" id="code" name="code" 
                       value="{{ code if code else '' }}" 
                       placeholder="____" 
                       required 
                       maxlength="4"
                       pattern="\d{4}"
                       inputmode="numeric"
                       autocomplete="one-time-code"
                       class="form-control code-input">
                <small class="form-text">Код действителен в течение 5 минут</small>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Подтвердить</button>
        </form>
        
        <div class="auth-footer">
            <p id="resend-timer">Повторная отправка через <span id="timer">60</span> сек.</p>
            <button id="resend-btn" class="btn btn-link" disabled onclick="resendSMS()">Отправить код повторно</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Таймер обратного отсчета для повторной отправки
let timeLeft = 60;
const timerElement = document.getElementById('timer');
const resendBtn = document.getElementById('resend-btn');
const timerContainer = document.getElementById('resend-timer');

const countdown = setInterval(() => {
    timeLeft--;
    timerElement.textContent = timeLeft;
    
    if (timeLeft <= 0) {
        clearInterval(countdown);
        timerContainer.style.display = 'none';
        resendBtn.disabled = false;
    }
}, 1000);

// Повторная отправка SMS
async function resendSMS() {
    try {
        const response = await fetch('{{ url_for("public.resend_sms") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        
        const data = await response.json();
        
        if (data.success) {
            alert('Код отправлен повторно');
            // Сбрасываем таймер
            timeLeft = 60;
            timerElement.textContent = timeLeft;
            timerContainer.style.display = 'block';
            resendBtn.disabled = true;
            countdown = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerContainer.style.display = 'none';
                    resendBtn.disabled = false;
                }
            }, 1000);
        } else {
            alert(data.message || 'Ошибка при отправке кода');
        }
    } catch (error) {
        alert('Ошибка при отправке кода. Попробуйте позже.');
    }
}

// Автофокус на поле ввода кода
document.getElementById('code').focus();

// Автоподтверждение при вводе 4 цифр
document.getElementById('code').addEventListener('input', function(e) {
    if (this.value.length === 4 && /^\d{4}$/.test(this.value)) {
        // Можно добавить автоотправку формы
        // this.form.submit();
    }
});
</script>

<style>
.code-input {
    font-size: 24px;
    letter-spacing: 8px;
    text-align: center;
    max-width: 200px;
    margin: 0 auto;
    display: block;
}
</style>
{% endblock %}
