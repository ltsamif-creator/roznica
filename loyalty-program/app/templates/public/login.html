{% extends "base.html" %}

{% block title %}Вход - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Вход в личный кабинет</h1>
        <p class="auth-subtitle">Введите номер телефона для получения кода подтверждения</p>
        
        <form method="POST" action="{{ url_for('public.login') }}" class="auth-form">
            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" 
                       value="{{ phone if phone else '' }}" 
                       placeholder="+7 (___) ___-__-__" 
                       required 
                       pattern="\+7\d{10}"
                       class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Получить код входа</button>
        </form>
        
        <div class="auth-footer">
            <p>Нет аккаунта? <a href="{{ url_for('public.register') }}">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Маска для телефона - отправляет чистый номер без лишних символов
document.getElementById('phone').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.startsWith('7')) {
        value = value.substring(0, 11);
    } else if (value.length > 10) {
        value = value.substring(0, 11);
    }
    
    if (value.length >= 1) {
        let formatted = '+7';
        if (value.length > 1) {
            formatted += ' (' + value.substring(1, 4);
        }
        if (value.length > 4) {
            formatted += ') ' + value.substring(4, 7);
        }
        if (value.length > 7) {
            formatted += '-' + value.substring(7, 9);
        }
        if (value.length > 9) {
            formatted += '-' + value.substring(9, 11);
        }
        e.target.value = formatted;
    }
});

// Перед отправкой формы очищаем номер от всех нецифровых символов
document.querySelector('form').addEventListener('submit', function(e) {
    const phoneInput = document.getElementById('phone');
    // Сохраняем чистый номер (только цифры) в поле перед отправкой
    phoneInput.value = phoneInput.value.replace(/\D/g, '');
    console.log('[DEBUG] Отправляемый номер телефона:', phoneInput.value);
});
</script>
{% endblock %}
